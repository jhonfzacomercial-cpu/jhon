<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Cérebro Editorial FZA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sidebar de navegação fixa + área de trabalho; gaveta lateral para o conteúdo aberto. Identidade FZA: preto, dourado, roxo, Poppins. */
:root{
  color-scheme:dark;
  --bg:#0A0A0A; --surface:#141316; --surface-2:#1C1B20; --surface-3:#25232B;
  --fg:#F2F1F4; --muted:#9A97A6; --line:#2A2830; --line-2:#3A3742;
  --gold:#FFBB46; --gold-2:#EAA935; --gold-ink:#1A1204; --gold-soft:rgba(255,187,70,.12);
  --purple:#9D7BEA; --purple-soft:rgba(157,123,234,.14);
  --teal:#4FD1C5; --teal-soft:rgba(79,209,197,.13);
  --ok:#4ADE80; --warn:#FBBF24; --bad:#F87171;
  --s-ideia:#7C7889; --s-plan:#60A5FA; --s-prod:#FBBF24; --s-rev:#F97316; --s-apr:#4ADE80; --s-ag:#9D7BEA; --s-pub:#22C55E;
  --shadow:0 20px 60px rgba(0,0,0,.55);
  --f-ui:"Poppins",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#F3F2F6; --surface:#FFFFFF; --surface-2:#F7F6FA; --surface-3:#ECEAF2;
    --fg:#141218; --muted:#5F5B6D; --line:#E1DEE8; --line-2:#CFCBD9;
    --gold:#B7780A; --gold-2:#9A6405; --gold-ink:#FFFFFF; --gold-soft:rgba(234,169,53,.16);
    --purple:#7043CA; --purple-soft:rgba(112,67,202,.10);
    --teal:#0F8A80; --teal-soft:rgba(15,138,128,.10);
    --ok:#15803D; --warn:#B45309; --bad:#DC2626;
    --s-ideia:#8A8698; --s-plan:#2563EB; --s-prod:#D97706; --s-rev:#EA580C; --s-apr:#16A34A; --s-ag:#7043CA; --s-pub:#15803D;
    --shadow:0 20px 60px rgba(30,20,60,.18);
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#F3F2F6; --surface:#FFFFFF; --surface-2:#F7F6FA; --surface-3:#ECEAF2;
  --fg:#141218; --muted:#5F5B6D; --line:#E1DEE8; --line-2:#CFCBD9;
  --gold:#B7780A; --gold-2:#9A6405; --gold-ink:#FFFFFF; --gold-soft:rgba(234,169,53,.16);
  --purple:#7043CA; --purple-soft:rgba(112,67,202,.10);
  --teal:#0F8A80; --teal-soft:rgba(15,138,128,.10);
  --ok:#15803D; --warn:#B45309; --bad:#DC2626;
  --s-ideia:#8A8698; --s-plan:#2563EB; --s-prod:#D97706; --s-rev:#EA580C; --s-apr:#16A34A; --s-ag:#7043CA; --s-pub:#15803D;
  --shadow:0 20px 60px rgba(30,20,60,.18);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance;font-weight:600}
h1{font-size:24px;letter-spacing:-.01em}
h2{font-size:17px}
h3{font-size:14px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;align-self:start;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:20px;padding:22px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.02em}
.brand b{display:block;font-size:14px;font-weight:600;line-height:1.1}
.brand span{font-size:11px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:8px;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--gold-soft);color:var(--fg)}
.nav button[aria-current="page"] .ico{color:var(--gold)}
.nav .l{display:flex;align-items:center;gap:10px}
.ico{width:18px;height:18px;flex:none}
.nav .n{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:0 8px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle}
.dot.on{background:var(--ok)} .dot.off{background:var(--warn)}
main{min-width:0;padding-block:28px 60px;padding-inline:32px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner{border:1px solid var(--line-2);background:var(--surface-2);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--muted)}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 50%,transparent);color:var(--fg)}

/* controls */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface-2);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:600}
.btn.pri:hover{background:var(--gold-2);border-color:var(--gold-2)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:transparent}
.btn.sm{padding:5px 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:12px;font-weight:500;color:var(--muted)}
.field .hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=password],input[type=number],input[type=month],input[type=date],input[type=search],select,textarea{background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:72px;line-height:1.5}
select{cursor:pointer}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filters .field{width:auto;min-width:150px;flex:1 1 150px;max-width:220px}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.kpi{background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .k{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sw{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}

/* chips */
.fmt{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:6px;white-space:nowrap}
.fmt.card{background:var(--gold-soft);color:var(--gold)}
.fmt.carrossel{background:var(--purple-soft);color:var(--purple)}
.fmt.reel{background:var(--teal-soft);color:var(--teal)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.tag{display:inline-flex;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.tag.ex{border-color:color-mix(in srgb,var(--purple) 50%,transparent);color:var(--purple)}

/* status bar */
.sbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface-3);gap:2px}
.sbar i{display:block;height:100%}
.slegend{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px 16px;margin-top:14px}
.slegend div{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
.slegend b{font-variant-numeric:tabular-nums;font-weight:600}
.prog{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;min-width:60px}
.prog i{display:block;height:100%;background:var(--gold)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.tt{font-weight:500;max-width:420px}
.empty{padding:36px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--fg);font-weight:600;font-size:15px}

/* clientes */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.ccard{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.ccard:hover{border-color:var(--line-2)}
.ccard:focus-visible{outline:2px solid var(--gold)}
.ccard h3{font-size:16px}
.ccard .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px}
.avatar{width:40px;height:40px;border-radius:10px;background:var(--surface-3);display:grid;place-items:center;font-weight:600;color:var(--gold);flex:none}

/* ficha */
.ficha{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;align-items:start}
.toc{position:sticky;top:20px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.toc a{color:var(--muted);text-decoration:none;padding:5px 10px;border-radius:6px;display:flex;gap:8px}
.toc a:hover{color:var(--fg);background:var(--surface-2)}
.toc a .mono{font-size:11px;color:var(--gold);min-width:18px}
.fsec{display:flex;flex-direction:column;gap:12px;padding:20px 0;border-bottom:1px solid var(--line);scroll-margin-top:20px}
.fsec:first-child{padding-top:0}
.fsec .sh{display:flex;gap:12px;align-items:baseline}
.fsec .sh .mono{color:var(--gold);font-size:12px}
.fsec .desc{font-size:13px;color:var(--muted);max-width:62ch}
.persona{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tons{display:flex;flex-wrap:wrap;gap:8px}
.tons label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:13px;user-select:none}
.tons input{accent-color:var(--gold)}
.tons label:has(input:checked){background:var(--gold-soft);border-color:var(--gold);color:var(--fg)}
.savebar{position:sticky;bottom:0;display:flex;gap:10px;justify-content:flex-end;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%);flex-wrap:wrap}
.meter{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.meter .prog{width:90px}

/* planejamento */
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.qty{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.qbox{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.steps{display:flex;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.step{flex:1;padding:10px 14px;display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);border-right:1px solid var(--line);min-width:0}
.step:last-child{border-right:0}
.step .n{width:22px;height:22px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;flex:none}
.step.done .n{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.step.now{color:var(--fg);background:var(--gold-soft)}
.step.now .n{border-color:var(--gold);color:var(--gold)}
.analise{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 22px;margin-top:12px}
.analise div{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px solid var(--line)}
.analise dt{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.analise dd{margin:0;font-size:13px}
details summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font-family:var(--f-mono);color:var(--muted)}
details[open] summary::after{content:"–"}
.sugs{display:flex;flex-direction:column;gap:10px}
.sug{display:grid;grid-template-columns:28px 132px minmax(0,1fr) 190px auto;gap:12px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.sug.off{opacity:.55}
.sug .chk{padding-top:6px}
.sug .chk input{width:18px;height:18px;accent-color:var(--gold);cursor:pointer}
.sug .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.sug .body input.tit{font-weight:500;background:transparent;border-color:transparent;padding:4px 6px;margin-left:-6px}
.sug .body input.tit:hover,.sug .body input.tit:focus{border-color:var(--line-2);background:var(--surface-2)}
.sug .sub{font-size:12px;color:var(--muted)}
.sug .left{display:flex;flex-direction:column;gap:6px}
.sug .acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.genbox{border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);background:var(--gold-soft);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.spin{width:14px;height:14px;border:2px solid var(--line-2);border-top-color:var(--gold);border-radius:50%;animation:sp 0.9s linear infinite;display:inline-block;vertical-align:middle;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}

/* calendário */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--line);gap:1px}
.cal .dow{background:var(--surface-2);padding:8px 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cal .day{background:var(--surface);min-height:118px;padding:8px;display:flex;flex-direction:column;gap:5px;min-width:0}
.cal .day.out{background:var(--bg)}
.cal .day.wk{background:var(--surface-2)}
.cal .day .d{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:4px}
.cal .day.today .d b{color:var(--gold-ink);background:var(--gold);border-radius:5px;padding:0 5px}
.cal .fer{font-size:10px;color:var(--purple);font-family:var(--f-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:5px 7px;border-radius:7px;font-size:12px;border-left:3px solid var(--c);background:var(--surface-2);min-width:0}
.ev:hover{background:var(--surface-3)}
.ev:focus-visible{outline:2px solid var(--gold)}
.ev .top{display:flex;justify-content:space-between;gap:6px;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--c)}
.ev .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
.ev .cl{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.card{--c:var(--gold)} .ev.carrossel{--c:var(--purple)} .ev.reel{--c:var(--teal)}

/* gaveta */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
.dr-h{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.dr-h .x{margin-left:auto}
.dr-b>*{flex-shrink:0}
.dr-b{overflow-y:auto;padding:18px 20px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.meta-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{all:unset;cursor:pointer;padding:8px 12px;font-size:13px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--gold)}
.tabs button:focus-visible{outline:2px solid var(--gold)}
.blk{display:flex;flex-direction:column;gap:6px}
.blk .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:600}
.blk p,.blk li{white-space:pre-wrap;font-size:14px}
.art{aspect-ratio:4/5;max-width:100%;width:340px;border-radius:14px;background:#0A0A0A;color:#F2F1F4;padding:26px 24px;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;position:relative;overflow:hidden;border:1px solid var(--line-2)}
.art::before{content:"";position:absolute;inset:auto -30% 55% auto;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(112,67,202,.55),transparent 70%)}
.art .cl{position:absolute;top:20px;left:24px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#FFBB46;font-weight:600}
.art .hl{font-size:24px;font-weight:700;line-height:1.12;position:relative}
.art .sb{font-size:13px;color:#C9C6D2;position:relative}
.art .cta{align-self:flex-start;background:#FFBB46;color:#1A1204;font-weight:600;font-size:12px;padding:7px 14px;border-radius:99px;position:relative}
.slides{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.slide{flex:0 0 250px;aspect-ratio:4/5;border-radius:12px;background:#0A0A0A;color:#F2F1F4;padding:18px;display:flex;flex-direction:column;gap:8px;scroll-snap-align:start;border:1px solid var(--line-2);overflow:auto}
.slide .n{font-family:var(--f-mono);font-size:10px;color:#FFBB46;letter-spacing:.08em;text-transform:uppercase}
.slide .t{font-weight:600;font-size:16px;line-height:1.2}
.slide .x{font-size:12px;color:#C9C6D2;white-space:pre-wrap}
.slide .v{margin-top:auto;font-size:11px;color:#9D7BEA;font-style:italic}
.script{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.script>div{display:grid;grid-template-columns:96px minmax(0,1fr);border-bottom:1px solid var(--line)}
.script>div:last-child{border-bottom:0}
.script .k{padding:12px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--teal);background:var(--surface-2)}
.script .v{padding:12px 14px;white-space:pre-wrap}

<script>
/* ============================================================
   CONFIGURAÇÃO
   ============================================================ */
const STATUS = ['Ideia','Em planejamento','Em produção','Em revisão','Aprovado','Agendado','Publicado'];
const STATUS_COR = {'Ideia':'--s-ideia','Em planejamento':'--s-plan','Em produção':'--s-prod','Em revisão':'--s-rev','Aprovado':'--s-apr','Agendado':'--s-ag','Publicado':'--s-pub'};
const FMT = {
  card:{nome:'Card',plural:'Cards',cor:'--gold'},
  carrossel:{nome:'Carrossel',plural:'Carrosséis',cor:'--purple'},
  reel:{nome:'Reel',plural:'Reels',cor:'--teal'}
};
const FMT_ORD = ['card','carrossel','reel'];
const OBJETIVOS = ['Atrair atenção','Gerar reconhecimento de marca','Educar','Gerar autoridade','Trabalhar uma dor','Trabalhar um desejo','Quebrar objeção','Apresentar produto','Apresentar serviço','Mostrar diferencial','Gerar interação','Gerar leads','Gerar mensagens no WhatsApp','Gerar visitas ao perfil','Gerar salvamentos','Gerar compartilhamentos','Conversão'];
const TONS = ['Profissional','Técnico','Próximo','Sofisticado','Popular','Educativo','Autoridade','Descontraído'];
const PERSONA = [['perfil','Perfil'],['necessidades','Necessidades'],['dores','Dores'],['desejos','Desejos'],['comportamentos','Comportamentos'],['motivacoes','Motivações'],['duvidas','Dúvidas'],['objecoes','Objeções']];
const FICHA = [
  {k:'nicho',t:'Nicho e Atuação',d:'Segmento de mercado e área específica de atuação da empresa.'},
  {k:'resumo',t:'O que a empresa faz — Resumo',d:'Descrição clara e objetiva da empresa, seus produtos e/ou serviços.'},
  {k:'tom',t:'Tom de Voz',d:'Como a empresa deve se comunicar. Marque os tons e descreva nuances.'},
  {k:'publico',t:'Público-Alvo',d:'Descrição do público que a empresa deseja atingir.'},
  {k:'persona',t:'Persona',d:'Descrição detalhada do cliente ideal.'},
  {k:'produtos',t:'Produto / Serviço',d:'Produtos e serviços oferecidos pela empresa.'},
  {k:'proibidas',t:'Palavras Proibidas',d:'Termos, expressões ou abordagens que nunca devem aparecer. Separe por vírgula. O sistema bloqueia automaticamente.'},
  {k:'obrigatorias',t:'Palavras Obrigatórias',d:'Termos que devem ser usados quando fizer sentido estratégico. Separe por vírgula.'},
  {k:'promessa',t:'A Grande Promessa',d:'Principal transformação, benefício ou resultado que a empresa promete entregar.'},
  {k:'diferenciais',t:'Diferenciais',d:'O que diferencia essa empresa dos concorrentes.'},
  {k:'objecoes',t:'Objeções Mais Comuns',d:'Principais motivos que fazem o potencial cliente não comprar ou não entrar em contato.'}
];
const QUAL = [
  ['estrategia','Estratégia',['O conteúdo possui objetivo claro','Está relacionado ao tema do mês','Está relacionado ao negócio do cliente','Está adequado à persona']],
  ['marca','Marca',['Respeita o tom de voz','Utiliza os diferenciais corretos','Respeita palavras proibidas','Utiliza palavras obrigatórias quando apropriado']],
  ['copy','Copy',['O título gera interesse','Existe promessa ou benefício claro','O conteúdo é específico','Evita clichês','Evita frases genéricas de marketing','A CTA está coerente']],
  ['seo','SEO',['Existe palavra-chave principal','A palavra-chave aparece naturalmente','Existem termos relacionados','A legenda responde à intenção do usuário']],
  ['repeticao','Repetição',['Assunto ainda não trabalhado','Headline ainda não utilizada','Abordagem diferente de conteúdos anteriores']]
];
// Feriados nacionais de data fixa (evitados na distribuição automática de datas)
const FERIADOS = {'01-01':'Confraternização','04-21':'Tiradentes','05-01':'Dia do Trabalho','09-07':'Independência','10-12':'N. Sra. Aparecida','11-02':'Finados','11-15':'Proclamação da República','11-20':'Consciência Negra','12-25':'Natal'};
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DOW = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

/* ============================================================
   ESTADO
   ============================================================ */
const S = {
  clientes:new Map(), planos:new Map(), conteudos:new Map(),
  carregado:{clientes:false,planos:false,conteudos:false},
  modo:'carregando', erroDb:null, iaOk:null, iaMotivo:'',
  gen:null, sugerindo:new Set(), regerando:new Set(),
  ui:{view:'painel', clienteId:null, planoId:null, drawer:null, aba:'material', confirm:null,
      fPainel:{cliente:'',mes:hojeMes()},
      fCal:{mes:hojeMes(),cliente:'',formato:'',status:''},
      fBanco:{cliente:'',mes:'',formato:'',status:'',q:''}}
};
let sample = null;

/* ============================================================
   UTILITÁRIOS
   ============================================================ */
function h(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(p){return (p||'')+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function agora(){return new Date().toISOString()}
function pad(n){return String(n).padStart(2,'0')}
function hojeISO(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function hojeMes(){return hojeISO().slice(0,7)}
function mesNome(m){if(!m)return '';const [y,mm]=m.split('-');return MESES[+mm-1]+' '+y}
function dataCurta(d){if(!d)return '—';const [y,m,dd]=d.split('-');const w=new Date(+y,+m-1,+dd).getDay();return dd+'/'+m+' · '+DOW[w].toLowerCase()}
function mesAdd(m,n){const [y,mm]=m.split('-').map(Number);const d=new Date(y,mm-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function lista(s){return String(s||'').split(/[,;\n]/).map(x=>x.trim()).filter(Boolean)}
function iniciais(n){return String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function numLabel(c){return (FMT[c.formato]?.nome||c.formato)+' '+pad(c.numero||0)}
function corStatus(s){return 'var('+(STATUS_COR[s]||'--muted')+')'}
function stChip(s){return `<span class="st" style="--c:${corStatus(s)}">${h(s)}</span>`}
function fmtChip(f){return `<span class="fmt ${h(f)}">${h(FMT[f]?.nome||f)}</span>`}
const STOP = new Set('a o e de da do das dos em no na nos nas um uma para por com sem que se sua seu suas seus voce sua ao aos as os ou mais como e é nao não isso esse essa este esta pra pro ja já tem ter ser sao são'.split(' '));
function tokens(s){return new Set(norm(s).replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>2&&!STOP.has(w)))}
function jaccard(a,b){const A=tokens(a),B=tokens(b);if(!A.size||!B.size)return 0;let i=0;A.forEach(x=>{if(B.has(x))i++});return i/(A.size+B.size-i)}
function completude(c){if(!c)return 0;let n=0;FICHA.forEach(f=>{if(f.k==='tom'){if((c.tom||[]).length||c.tomNotas)n++}else if(f.k==='persona'){if(Object.values(c.persona||{}).some(v=>String(v).trim()))n++}else if(String(c[f.k]||'').trim())n++});return Math.round(n/FICHA.length*100)}
function conteudosDe(fn){return [...S.conteudos.values()].filter(fn)}
function ordenarData(a,b){return (a.data||'9').localeCompare(b.data||'9')||(a.ordem||0)-(b.ordem||0)}
function headlineDe(c){const g=c.gerado;if(!g)return c.titulo||'';if(c.formato==='card')return g.headline||c.titulo;if(c.formato==='carrossel')return g.laminas?.[0]?.titulo||c.titulo;return g.gancho||c.titulo}
function ctaDe(c){const g=c.gerado;if(!g)return c.ctaPrevista||'';return c.formato==='card'?(g.ctaVisual||g.legenda?.cta):c.formato==='reel'?g.cta:(g.laminas?.[g.laminas.length-1]?.titulo||g.legenda?.cta)}

/* ============================================================
   PERSISTÊNCIA (db compartilhado; modo local se indisponível)
   ============================================================ */
const filas = new Map();
function enfileirar(chave,fn){const ant=filas.get(chave)||Promise.resolve();const p=ant.catch(()=>{}).then(fn);filas.set(chave,p);return p}
async function gravar(coll,id,doc){
  const d={...doc}; delete d.id;
  S[coll].set(id,{id,...d}); agendar(); return enviar([{op:'set',coll,id,doc:d}],coll+'/'+id);
}
async function alterar(coll,id,patch){const cur=S[coll].get(id);if(!cur)return;return gravar(coll,id,{...cur,...patch,atualizadoEm:agora()})}
async function apagar(coll,id){S[coll].delete(id);agendar();return enviar([{op:'del',coll,id}],coll+'/'+id)}

/* ============================================================
   IA — contexto, prompts, validação
   ============================================================ */
function fichaTexto(c){
  const p=c.persona||{};
  return `CLIENTE: ${c.nome}
1. NICHO E ATUAÇÃO: ${c.nicho||'—'}
2. O QUE A EMPRESA FAZ: ${c.resumo||'—'}
3. TOM DE VOZ: ${(c.tom||[]).join(', ')||'—'}${c.tomNotas?' — '+c.tomNotas:''}
4. PÚBLICO-ALVO: ${c.publico||'—'}
5. PERSONA:
${PERSONA.map(([k,l])=>`   - ${l}: ${p[k]||'—'}`).join('\n')}
6. PRODUTOS / SERVIÇOS: ${c.produtos||'—'}
7. PALAVRAS PROIBIDAS (nunca usar, nem variações ou sinônimos diretos): ${c.proibidas||'nenhuma'}
8. PALAVRAS OBRIGATÓRIAS (usar quando fizer sentido estratégico): ${c.obrigatorias||'nenhuma'}
9. A GRANDE PROMESSA: ${c.promessa||'—'}
10. DIFERENCIAIS: ${c.diferenciais||'—'}
11. OBJEÇÕES MAIS COMUNS: ${c.objecoes||'—'}`;
}
function historicoTexto(clienteId,excluir=new Set(),max=70){
  const itens=conteudosDe(c=>c.clienteId===clienteId&&!excluir.has(c.id)&&(c.gerado||c.titulo)).sort((a,b)=>(b.data||'').localeCompare(a.data||'')).slice(0,max);
  if(!itens.length) return 'Nenhum conteúdo anterior registrado para este cliente.';
  return itens.map(c=>{const g=c.gerado||{};const vis=c.formato==='card'?g.sugestaoVisual:c.formato==='reel'?g.visual:g.laminas?.[0]?.visual;
    return `- [${numLabel(c)} · ${c.mes}] Assunto: ${c.titulo||''} | Headline: ${headlineDe(c)} | Objetivo: ${c.objetivo||''} | Ângulo: ${c.angulo||''} | Palavra-chave: ${c.palavraChave||''} | CTA: ${ctaDe(c)||''}${vis?' | Visual: '+String(vis).slice(0,90):''}`}).join('\n');
}
const REGRAS_BASE = `REGRAS INEGOCIÁVEIS
- A FICHA DO CLIENTE é a base de conhecimento obrigatória. Se algo entrar em conflito com a ficha, a ficha prevalece.
- Nada de conteúdo genérico: cada peça precisa citar o contexto real do cliente (nicho, persona, produto, diferencial, objeção).
- Palavras proibidas nunca aparecem, nem em hashtags.
- Não repita assuntos, headlines, argumentos, CTAs, abordagens nem ideias visuais do HISTÓRICO nem dos outros conteúdos do mês.
- Português do Brasil, natural, específico, sem clichês ("no mundo de hoje", "você sabia", "não perca", "venha conferir", "qualidade e excelência") e sem frases genéricas de marketing.`;
function promptSugestoes(pl,cl,extra){
  const q=pl.qtd; const total=q.card+q.carrossel+q.reel;
  return `Você é o estrategista editorial sênior do Grupo FZA, agência de marketing. Monte o planejamento editorial mensal deste cliente.

${fichaTexto(cl)}

PLANEJAMENTO
- Mês: ${mesNome(pl.mes)}
- Tema(s) principal(is): ${pl.temas}
- Quantidade EXATA: ${q.card} Card(s), ${q.carrossel} Carrossel(éis), ${q.reel} Reel(s) — total ${total}.
${pl.instrucoes?'- Orientações da equipe: '+pl.instrucoes:''}

HISTÓRICO DE CONTEÚDOS DO CLIENTE (evite repetir):
${historicoTexto(cl.id)}
${extra||''}

ANTES DE PLANEJAR, responda internamente às 10 perguntas: quem é a empresa, quem é o público, qual a persona, qual problema resolvemos, qual desejo exploramos, qual produto/serviço se relaciona, qual diferencial reforçar, quais objeções trabalhar, qual o objetivo de cada conteúdo, qual formato transmite melhor cada mensagem.

${REGRAS_BASE}
- Os ${total} conteúdos formam um conjunto estratégico ao longo do mês (atração → educação → autoridade → objeções → conversão), não uma lista de posts soltos.
- Escolha o formato de cada ideia pelo que ela precisa: Card para uma mensagem única e direta; Carrossel para passo a passo, lista, comparação, mitos; Reel para gancho forte, bastidores, demonstração, fala direta.
- Objetivo de cada conteúdo: escolha exatamente um desta lista: ${OBJETIVOS.join('; ')}.
- Ordene a lista na sequência de publicação ideal.

Responda SOMENTE com JSON válido neste formato:
{"analise":{"empresa":"...","publico":"...","persona":"...","problema":"...","desejo":"...","produto":"...","diferencial":"...","objecoes":"...","linhaNarrativa":"como os conteúdos se conectam ao longo do mês"},
 "conteudos":[{"formato":"card|carrossel|reel","tema":"subtema dentro do tema do mês","objetivo":"um da lista","titulo":"ideia/título de trabalho específico","angulo":"abordagem (ex.: erro comum, comparação, bastidores)","palavraChave":"palavra-chave principal de busca","ctaPrevista":"CTA pensada","porque":"por que essa peça existe no plano (1 frase)"}]}
A lista "conteudos" deve ter exatamente ${total} itens: ${q.card} com formato "card", ${q.carrossel} com "carrossel" e ${q.reel} com "reel".`;
}
function promptUmaSugestao(item,pl,cl){
  const irmaos=conteudosDe(c=>c.planoId===pl.id&&c.id!==item.id).map(c=>`- ${numLabel(c)}: ${c.titulo} (${c.objetivo}; ângulo: ${c.angulo})`).join('\n');
  return `Você é o estrategista editorial do Grupo FZA. Crie UMA nova ideia de ${FMT[item.formato].nome} para o planejamento de ${mesNome(pl.mes)} deste cliente, substituindo a ideia "${item.titulo}".

${fichaTexto(cl)}

TEMA DO MÊS: ${pl.temas}

OUTRAS PEÇAS DESTE MÊS (não repetir assunto, ângulo nem CTA):
${irmaos||'—'}

HISTÓRICO (não repetir):
${historicoTexto(cl.id,new Set([item.id]),50)}

${REGRAS_BASE}
Objetivo: um desta lista: ${OBJETIVOS.join('; ')}.

Responda SOMENTE com JSON: {"tema":"...","objetivo":"...","titulo":"...","angulo":"...","palavraChave":"...","ctaPrevista":"...","porque":"..."}`;
}
const LEGENDA_SPEC = `LEGENDA (obrigatória), em 5 partes:
1. "h1": PRIMEIRA LINHA — H1 humano + SEO: contém a palavra-chave principal, responde direto ao que a pessoa procura, gera interesse, soa natural.
2. "valor": PARÁGRAFO DE VALOR — explica o assunto de forma objetiva e aprofunda (não repete) o que está na peça. Nada institucional ou genérico.
3. "variacoes": parágrafo curto usando naturalmente sinônimos, variações da palavra-chave e termos do nicho (sem keyword stuffing).
4. "cta": CTA FINAL coerente com o objetivo.
5. "hashtags": 5 a 10 hashtags estratégicas ligadas ao assunto, nicho e intenção de busca (nada genérico como #love #instagood).`;
const QUAL_SPEC = `REVISÃO DE QUALIDADE (faça ANTES de responder e corrija o que falhar):
ESTRATÉGIA: objetivo claro? ligado ao tema do mês? ligado ao negócio? adequado à persona?
MARCA: respeita o tom de voz? usa os diferenciais corretos? respeita palavras proibidas? usa palavras obrigatórias quando apropriado?
COPY: título gera interesse? promessa/benefício claro? é específico? evita clichês? evita frases genéricas de marketing? CTA coerente?
SEO: tem palavra-chave principal? aparece naturalmente? há termos relacionados? a legenda responde à intenção do usuário?
REPETIÇÃO: assunto novo? headline nova? abordagem diferente do histórico?
Reporte o resultado final (depois das correções) em "qualidade" com arrays de true/false na ordem das perguntas, "nota" de 0 a 10 e "correcoes" (o que você ajustou na revisão).`;
function specFormato(f){
  if(f==='card') return `FORMATO: CARD ÚNICO
- "headline": título impactante com foco na dor, desejo, benefício, problema ou oportunidade da persona (curto, cabe na arte).
- "subheadline": explicação curta da solução, benefício ou diferencial.
- "ctaVisual": chamada curta na arte (ex.: Saiba mais, Chame no WhatsApp, Solicite seu orçamento, Salve este conteúdo, Link na bio).
- "sugestaoVisual": conceito de imagem/foto/ilustração que complementa o card (apenas descrever, não gerar imagem).
JSON: {"headline":"","subheadline":"","ctaVisual":"","sugestaoVisual":"","palavraChave":"","termosRelacionados":[""],"legenda":{"h1":"","valor":"","variacoes":"","cta":"","hashtags":["#..."]},"qualidade":{"estrategia":[true,true,true,true],"marca":[true,true,true,true],"copy":[true,true,true,true,true,true],"seo":[true,true,true,true],"repeticao":[true,true,true],"nota":9,"correcoes":""}}`;
  if(f==='carrossel') return `FORMATO: CARROSSEL
Defina tema, objetivo, quantidade de lâminas (variável conforme a complexidade; não limite a 5) e estrutura narrativa.
Estrutura: Lâmina 1 CAPA (título principal + complemento + sugestão visual; gera curiosidade para deslizar) → Lâmina 2 CONTEXTUALIZAÇÃO/PROBLEMA → lâminas intermediárias de DESENVOLVIMENTO (passo a passo, lista, comparação, erros, estratégias, exemplos, dados, mitos e verdades, problema x solução, antes x depois — escolha o que o tema pede) → PENÚLTIMA: VALOR/CONCLUSÃO (liga ao diferencial do cliente quando fizer sentido) → ÚLTIMA: CTA coerente com o objetivo.
A legenda complementa as lâminas, sem repeti-las.
JSON: {"numLaminas":7,"estruturaNarrativa":"ex.: lista de erros","laminas":[{"n":1,"papel":"Capa","titulo":"","texto":"complemento/corpo da lâmina","visual":"sugestão visual"}],"palavraChave":"","termosRelacionados":[""],"legenda":{"h1":"","valor":"","variacoes":"","cta":"","hashtags":["#..."]},"qualidade":{...mesmo formato: estrategia[4], marca[4], copy[6], seo[4], repeticao[3], nota, correcoes}}`;
  return `FORMATO: REEL (roteiro completo)
- "gancho": texto EXATO falado nos primeiros segundos (pergunta, afirmação forte, erro comum, dor, desejo, curiosidade, quebra de expectativa, dado ou problema). "tipoGancho": qual desses.
- "corpo": roteiro completo da fala (valor/tensão), objetivo, que mantém a atenção.
- "cta": texto EXATO da chamada para ação.
- "visual": orientações de gravação e edição: cena, enquadramento, ação, B-roll, elementos visuais.
- "textoNaTela": lista de textos que aparecem no vídeo.

function arr(v){return Array.isArray(v)?v.map(x=>String(x??'')).filter(Boolean):(v?[String(v)]:[])}
function normalizar(g,f){
  g=g&&typeof g==='object'?g:{};

  const out={legenda:{h1:String(L.h1||''),valor:String(L.valor||''),variacoes:String(L.variacoes||''),cta:String(L.cta||''),hashtags:arr(L.hashtags).map(t=>t.startsWith('#')?t:'#'+t.replace(/\s+/g,''))},

  if(f==='card'){Object.assign(out,{headline:String(g.headline||''),subheadline:String(g.subheadline||''),ctaVisual:String(g.ctaVisual||''),sugestaoVisual:String(g.sugestaoVisual||'')})}

  else {Object.assign(out,{duracao:String(g.duracao||''),gancho:String(g.gancho||''),tipoGancho:String(g.tipoGancho||''),corpo:String(g.corpo||''),cta:String(g.cta||''),visual:String(g.visual||''),textoNaTela:arr(g.textoNaTela),audio:String(g.audio||'')})}

  qo.nota=Math.max(0,Math.min(10,Number(q.nota)||0));qo.correcoes=String(q.correcoes||'');

function textoTotal(g){return JSON.stringify(g)}
function termosProibidosEncontrados(g,cl){
  const txt=' '+norm(textoTotal(g)).replace(/[^a-z0-9#%]+/g,' ')+' ';
  return lista(cl.proibidas).filter(t=>{const n=norm(t).replace(/[^a-z0-9#%]+/g,' ').trim();return n&&txt.includes(' '+n+' ')});
}
function validar(it,g,cl){
  const flags=[];const L=g.legenda||{};
  const proib=termosProibidosEncontrados(g,cl);
  if(proib.length) flags.push({tipo:'erro',codigo:'proibida',msg:'Palavras proibidas encontradas: '+proib.join(', ')+'.'});
  const falt=['h1','valor','variacoes','cta'].filter(k=>!String(L[k]||'').trim());
  if(falt.length) flags.push({tipo:'erro',msg:'Legenda incompleta: faltando '+falt.map(k=>({h1:'primeira linha',valor:'parágrafo de valor',variacoes:'termos secundários',cta:'CTA'}[k])).join(', ')+'.'});
  if((L.hashtags||[]).length<3) flags.push({tipo:'aviso',msg:'Poucas hashtags na legenda.'});
  if((L.hashtags||[]).length>15) flags.push({tipo:'aviso',msg:'Hashtags demais na legenda (mais de 15).'});
  const kw=g.palavraChave||it.palavraChave;
  if(!kw) flags.push({tipo:'aviso',msg:'Sem palavra-chave principal definida.'});
  else { const kt=[...tokens(kw)];const h1=tokens(L.h1);const hit=kt.filter(t=>h1.has(t)).length; if(kt.length&&hit/kt.length<0.6) flags.push({tipo:'aviso',msg:`A palavra-chave "${kw}" não aparece com clareza na primeira linha da legenda.`}); }
  const obr=lista(cl.obrigatorias); if(obr.length){const txt=norm(textoTotal(g));const us=obr.filter(o=>txt.includes(norm(o)));if(!us.length)flags.push({tipo:'info',msg:'Nenhuma palavra obrigatória foi usada nesta peça. Verifique se faria sentido.'});}
  if(it.formato==='carrossel'&&(g.laminas||[]).length<4) flags.push({tipo:'aviso',msg:'Carrossel com menos de 4 lâminas.'});
  const head=it.formato==='card'?g.headline:it.formato==='carrossel'?g.laminas?.[0]?.titulo:g.gancho;
  let pior=null;
  conteudosDe(c=>c.clienteId===it.clienteId&&c.id!==it.id&&c.gerado).forEach(c=>{const s=jaccard(head,headlineDe(c));if(s>=0.5&&(!pior||s>pior.s))pior={s,c}});
  if(pior) flags.push({tipo:'aviso',codigo:'repeticao',msg:`Headline parecida com ${numLabel(pior.c)} de ${mesNome(pior.c.mes)}: "${headlineDe(pior.c)}".`});
  const cta=norm(it.formato==='card'?g.ctaVisual:it.formato==='reel'?g.cta:L.cta).trim();
  if(cta){const igual=conteudosDe(c=>c.planoId===it.planoId&&c.id!==it.id&&c.gerado).find(c=>norm(ctaDe(c)).trim()===cta);if(igual)flags.push({tipo:'aviso',msg:`CTA idêntica à do ${numLabel(igual)} deste mês.`});}
  return flags;
}

function diasUteis(mes){
  const [y,m]=mes.split('-').map(Number);const n=new Date(y,m,0).getDate();const out=[];
  for(let d=1;d<=n;d++){const w=new Date(y,m-1,d).getDay();const k=pad(m)+'-'+pad(d);if(w>0&&w<6&&!FERIADOS[k])out.push(mes+'-'+pad(d))}
  return out;
}
function distribuirDatas(mes,n){const dias=diasUteis(mes);if(!n)return [];if(n===1)return [dias[0]];return Array.from({length:n},(_,i)=>dias[Math.round(i*(dias.length-1)/(n-1))])}

async function gerarSugestoes(planoId){

    const r=await sample.json(promptSugestoes(pl,cl),{cache:false});

    let i=0;

      const id=uid('ct-');
      await gravar('conteudos',id,{clienteId:cl.id,planoId,mes:pl.mes,formato:x.formato,numero:cont[x.formato],ordem:i,
        tema:String(x.tema||pl.temas),objetivo:OBJETIVOS.includes(x.objetivo)?x.objetivo:(OBJETIVOS.find(o=>norm(o)===norm(x.objetivo))||'Educar'),

        data:datas[i]||'',status:'Ideia',responsavel:'',observacoes:'',aprovado:true,gerado:null,qualidade:null,flags:[],criadoEm:agora(),atualizadoEm:agora()});

}

async function salvarFicha(form){

  const doc={...cur,nome,tom:fd.getAll('tom').map(String),tomNotas:String(fd.get('tomNotas')||''),persona:Object.fromEntries(PERSONA.map(([k])=>[k,String(fd.get('p_'+k)||'')])),atualizadoEm:agora()};

}

function estadoPlano(p){if(S.sugerindo.has(p.id)||p.estado==='sugerindo')return ['Gerando sugestões','--s-plan'];if(p.estado==='erro')return ['Falha na IA','--bad'];const {its,ger}=progressoPlano(p);if(!its.length)return ['Sem sugestões','--s-ideia'];if(ger<its.length)return ['Revisão das sugestões','--s-rev'];return ['Conteúdos gerados','--s-apr']}

async function criarPlano(form){
  const fd=new FormData(form);const clienteId=String(fd.get('clienteId')||'');const mes=String(fd.get('mes')||'');const temas=String(fd.get('temas')||'').trim();
  const qtd=Object.fromEntries(FMT_ORD.map(f=>[f,Math.max(0,Math.min(30,parseInt(fd.get('q_'+f))||0))]));
  if(!clienteId||!mes||!temas)return toast('Preencha cliente, mês e tema.');
  if(!(qtd.card+qtd.carrossel+qtd.reel))return toast('Defina ao menos um conteúdo.');
  const cl=S.clientes.get(clienteId);if(completude(cl)<50)toast('A ficha deste cliente está incompleta. A IA vai gerar com menos contexto.');
  const id=uid('pl-');
  await gravar('planos',id,{clienteId,mes,temas,qtd,instrucoes:String(fd.get('instrucoes')||''),estado:'sugerindo',analise:null,erro:'',criadoEm:agora(),atualizadoEm:agora()});
  S.ui.view='plano';S.ui.planoId=id;agendar(true);
  gerarSugestoes(id);
}

  const sug=S.sugerindo.has(p.id)||p.estado==='sugerindo';
  const passo=sug?2:!its.length?2:pend.length?3:5;
  const g=S.gen&&S.gen.planoId===p.id?S.gen:null;
  const A=p.analise||{};
  const analise=[['empresa','Quem é a empresa'],['publico','Quem é o público'],['persona','Persona'],['problema','Problema que resolvemos'],['desejo','Desejo explorado'],['produto','Produto / serviço relacionado'],['diferencial','Diferencial a reforçar'],['objecoes','Objeções trabalhadas'],['linhaNarrativa','Linha narrativa do mês']].filter(([k])=>A[k]);

function vCalendario(){
  const f=S.ui.fCal;const [y,m]=f.mes.split('-').map(Number);const n=new Date(y,m,0).getDate();const ini=new Date(y,m-1,1).getDay();const hoje=hojeISO();
  const its=conteudosDe(c=>c.aprovado!==false&&c.mes===f.mes&&(!f.cliente||c.clienteId===f.cliente)&&(!f.formato||c.formato===f.formato)&&(!f.status||c.status===f.status));
  const porDia={};its.forEach(c=>{(porDia[c.data]=porDia[c.data]||[]).push(c)});
  const semData=its.filter(c=>!c.data||!c.data.startsWith(f.mes));
  let cells=DOW.map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<ini;i++)cells+=`<div class="day out" aria-hidden="true"></div>`;
  for(let d=1;d<=n;d++){const iso=f.mes+'-'+pad(d);const w=(ini+d-1)%7;const lst=(porDia[iso]||[]).sort(ordenarData);const fer=FERIADOS[pad(m)+'-'+pad(d)];
    cells+=`<div class="day ${w===0||w===6?'wk':''} ${iso===hoje?'today':''} ${lst.length?'':'vazio'}"><div class="d"><b>${pad(d)}<span class="mob-dow" style="display:none"> ${DOW[w]}</span></b>${fer?`<span class="fer">${fer}</span>`:''}</div>
    ${lst.map(c=>`<button class="ev ${c.formato}" data-act="abrir" data-id="${h(c.id)}"><span class="top"><span>${h(numLabel(c))}</span></span><span class="nm">${h(headlineDe(c))}</span><span class="cl"><span class="st" style="--c:${corStatus(c.status)};font-size:10px">${h(c.status)}</span> · ${h(S.clientes.get(c.clienteId)?.nome||'')}</span></button>`).join('')}</div>`}
  const resto=(7-((ini+n)%7))%7;for(let i=0;i<resto;i++)cells+=`<div class="day out" aria-hidden="true"></div>`;
  return `<div class="head"><div class="t"><span class="eyebrow">Etapas 8 e 9</span><h1>Calendário editorial</h1></div>
    <div class="row"><button class="btn sm" data-act="calMes" data-n="-1" aria-label="Mês anterior">←</button><b style="min-width:150px;text-align:center">${mesNome(f.mes)}</b><button class="btn sm" data-act="calMes" data-n="1" aria-label="Próximo mês">→</button></div></div>
  <div class="filters">

    <div class="field"><label for="fc-fmt">Formato</label><select id="fc-fmt" data-f="fCal.formato">${optFmt(f.formato)}</select></div>
    <div class="field"><label for="fc-st">Status</label><select id="fc-st" data-f="fCal.status">${optLista(STATUS,f.status,'Todos os status')}</select></div>
    <span class="muted mono" style="font-size:12px;padding-bottom:10px">${its.length} conteúdo${its.length===1?'':'s'}</span>
  </div>
  ${its.length?'':`<div class="banner">Nenhum conteúdo aprovado em ${mesNome(f.mes)} com esses filtros. Conteúdos entram aqui quando você aprova as sugestões de um planejamento.</div>`}
  <div class="cal">${cells}</div>
  ${semData.length?`<div class="panel"><h3>Sem data definida</h3><div class="row" style="margin-top:10px">${semData.map(c=>`<button class="btn sm" data-act="abrir" data-id="${h(c.id)}">${h(numLabel(c))}</button>`).join('')}</div></div>`:''}

const LS_SENHA='cerebro-fza-senha';
function lerLS(k){try{return localStorage.getItem(k)||''}catch{return ''}}

Object.assign(S,{login:false,pronto:false,status:null,versao:-1,pend:0,erroConexao:'',loginErro:''});
async function api(metodo,url,corpo){
  let r;
  try{r=await fetch(url,{method:metodo,headers:{'Content-Type':'application/json','x-senha-equipe':SENHA},body:corpo?JSON.stringify(corpo):undefined})}
  catch{throw {code:'network',mensagem:'Sem conexão com o servidor.'}}
  const j=await r.json().catch(()=>null);
  if(!r.ok){
    const code=j?.erro||(r.status===504?'timeout':'upstream_error');
    if(r.status===401){S.login=true;S.loginErro='Sua sessão expirou. Entre de novo com a senha da equipe.';agendar(true)}
    throw {code,mensagem:j?.mensagem||(r.status===504?'A IA demorou demais para responder. Tente de novo.':'Erro '+r.status+' no servidor.'),message:j?.mensagem};
  }
  return j;
}
function enviar(ops,chave){
  S.pend++;
  return enfileirar(chave||'lote',()=>api('POST','/api/dados',{ops}))
    .then(()=>{if(S.erroConexao){S.erroConexao='';agendar()}})
    .catch(e=>{if(e.code==='quota_exceeded'||e.code==='grande_demais')toast(e.mensagem);else{S.erroConexao='Uma alteração não foi salva no servidor: '+e.mensagem;agendar()}})
    .finally(()=>{S.pend--});
}
function carregarDados(d){['clientes','planos','conteudos'].forEach(k=>{const m=new Map();(Array.isArray(d?.[k])?d[k]:[]).forEach(x=>{if(x&&x.id)m.set(x.id,x)});S[k]=m})}
function snapshotDados(){return {versao:1,exportadoEm:agora(),clientes:[...S.clientes.values()],planos:[...S.planos.values()],conteudos:[...S.conteudos.values()]}}
async function sincronizar(forcar){
  if(S.pend>0&&!forcar)return;
  const d=await api('GET','/api/dados');
  if(S.pend>0&&!forcar)return;
  carregarDados(d);S.versao=d.versao;agendar();
}
let pollT=null;
async function checarVersao(){
  if(document.hidden||S.login||!S.pronto)return;
  try{const {versao}=await api('GET','/api/dados?so=versao');if(versao!==S.versao)await sincronizar();if(S.erroConexao&&!S.pend){S.erroConexao='';agendar()}}
  catch(e){if(e.code==='network'){S.erroConexao='Sem conexão com o servidor. As alterações feitas agora podem não ser salvas.';agendar()}}
}
function iniciarSync(){if(pollT)return;pollT=setInterval(checarVersao,20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checarVersao()})}
function criarIA(){
  const chamar=async(prompt)=>{const r=await api('POST','/api/ia',{prompt});return String(r.conteudo||'')};
  const ia=async(prompt)=>({text:await chamar(prompt),truncated:false});
  ia.json=async(prompt)=>{const txt=await chamar(prompt);try{return JSON.parse(txt)}catch{const m=txt.match(/\{[\s\S]*\}/);if(m)try{return JSON.parse(m[0])}catch{}throw {code:'invalid_json',text:txt}}};
  return ia;
}
function aplicarIA(){
  if(S.status?.ia){sample=criarIA();S.iaOk=null;S.iaMotivo=''}
  else{sample=null;S.iaOk=false;S.iaMotivo='A chave da OpenAI ainda não foi configurada no servidor. Cadastro, calendário e acompanhamento continuam funcionando.'}
}
async function entrar(){
  S.loginErro='';
  try{
    S.status=await api('GET','/api/status');
    if(!S.status.banco){S.login=false;S.pronto=false;S.erroConexao='O banco de dados ainda não foi conectado ao projeto no Vercel (Storage → Upstash Redis).';render(true);return}
    await sincronizar(true);
    S.login=false;S.pronto=true;S.erroConexao='';aplicarIA();
    ajustarMes();
    iniciarSync();
  }catch(e){
    if(e.code==='senha_invalida'){S.login=true;S.loginErro=SENHA?'Senha incorreta.':''}
    else if(e.code==='sem_senha_config'){S.login=true;S.loginErro=e.mensagem}
    else {S.erroConexao=e.mensagem||'Não foi possível conectar ao servidor.'}
  }
  render(true);
}

});
